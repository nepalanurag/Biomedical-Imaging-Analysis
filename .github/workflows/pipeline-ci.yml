name: pipeline-ci

on:
  push:
    branches: [main]
    paths: ["pipeline/**", "tests/**", ".github/workflows/pipeline-ci.yml",
            "Dockerfile", "dvc.yaml"]
  pull_request:
    paths: ["pipeline/**", "tests/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pipeline/requirements.txt
      - name: Run test suite
        run: pytest tests/ -q
      - name: Compile check
        run: python -m compileall -q pipeline tests

  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pipeline/requirements.txt
      - name: Ingest the committed RICORD series
        run: >-
          python -m pipeline.ingest
          --dicom-root "MIDRC-RICORD-1A-419639-000082"
          --out-dir pipeline_data
      - name: Validate the manifest
        run: >-
          python -m pipeline.validate
          --manifest pipeline_data/manifest.parquet
          --out-dir pipeline_data
      - name: Quantify eligible series
        run: >-
          python -m pipeline.quantify
          --manifest pipeline_data/manifest.parquet
          --out-dir pipeline_data
